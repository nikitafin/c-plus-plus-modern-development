name: Basic Pepeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image and does not push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./util/Dockerfile.ci
          tags: ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: true
      - name: Run pepeline-clang
        run: make workflow-clang-ci
      - name: Run pepeline-gcc
        run: make workflow-gcc-ci
